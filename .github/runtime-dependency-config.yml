# Runtime dependency baseline configuration.
#
# This file defines the repository-managed runtime dependency
# baseline and is the authoritative source of dependency intent.
#
# Supported platforms:
#   - Linux x64
#   - macOS ARM64
#   - Windows x64
#
# Dependency changes should be made in this file.
#
# Derived dependency files should be generated from this
# configuration and should not be edited manually.
#
# Current derived files:
#   - runtime/Brewfile
#   - runtime/cpanfile
#   - runtime/GENERATED-BASELINE-macos.md
#
# Future generated files may include:
#   - runtime/GENERATED-BASELINE-linux.md
#   - runtime/GENERATED-BASELINE-windows.md
#
# Repository governance:
#   - ADR-0007: Use Shared Runtime Configuration Files
#   - ADR-0009: Use Versioned and Reproducible Runtime
#               Dependency Baselines
#
# General principles:
#   - Dependency definitions must be version controlled.
#   - Dependency upgrades must be reviewed.
#   - Dependency changes must not occur automatically.
#   - Runtime dependency releases should be reproducible.
#
# Notes:
#   - Brewfile defines Homebrew installation instructions.
#   - cpanfile defines Perl dependency requirements.
#   - This file records dependency intent and approved
#     platform-specific versions.

globals:
  release:

    # Release channel assigned when a new runtime dependency
    # release is generated.
    channel_on_release: development

  # Runtime cache generation.
  #
  # Incremented automatically when a cache reset is performed.
  # Forms part of all runtime cache keys.
  cache_generation: 8

# Cross-platform Perl dependency baseline.
#
# These dependencies are reflected in runtime/cpanfile and
# will form the basis of future Carton dependency locking.
perl_dependencies:
  - App::cpanminus
  - PDL
  - PDL::GSL::CDF
  - Alien::geos::af
  - Alien::gdal
  - Geo::GDAL::FFI

platforms:

  macos:

    # macOS ARM64 runtime dependency baseline.

    # Perl version used for runtime dependency builds.
    perl_version: "5.38.4"

    # Homebrew dependency baseline.
    #
    # These dependencies are reflected in runtime/Brewfile.
    brew_dependencies:
      - yq
      - gsl
      - openssl@3

    # Homebrew OpenSSL formula used when building
    # Net::SSLeay and related SSL-dependent modules.
    openssl_formula: "openssl@3"

    # Documented macOS dependency versions.
    #
    # These values describe the approved dependency baseline
    # and can be referenced by workflows, validation scripts
    # and generated baseline documentation.
    system_dependencies:
      openssl: "3"
      sqlite: "3.44"
      gdal: "3.8"

  windows:

    # Windows x64 runtime dependency baseline.

    # Perl version used for runtime dependency builds.
    perl_version: "5.38.4"

    # Portable Perl distribution used by Windows builds.
    perl_portable_url: "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_53841_64bit/strawberry-perl-5.38.4.1-64bit-PDL.zip"

  linux:

    # Linux x64 runtime dependency baseline.

    # Perl version used for runtime dependency builds.
    perl_version: "5.38.4"
