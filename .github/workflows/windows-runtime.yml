name: Windows Runtime

on:
  push:
    branches:
      - development

  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
    outputs:
      windows_filename:
        value: ${{ jobs.runtime.outputs.windows_filename }}
      windows_sha256:
        value: ${{ jobs.runtime.outputs.windows_sha256 }}

  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: development
        type: choice
        options:
          - development
          - release

permissions:
  contents: write

jobs:
  runtime:
    runs-on: windows-latest

    outputs:
      windows_filename: ${{ steps.metadata.outputs.filename }}
      windows_sha256: ${{ steps.metadata.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v7

      - name: Determine build version
        shell: bash
        run: |
          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Load runtime configuration
        shell: bash
        run: |
          echo "PERL_VERSION=$(yq -r '.platforms.windows.perl_version' .github/runtime-dependency-config.yml)" >> "$GITHUB_ENV"

      - name: Generate BUILDINFO.txt
        shell: bash
        run: |
          mkdir build

          cat > build/BUILDINFO.txt <<EOF
          Platform: Windows
          Architecture: x64

          Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Git Commit: ${GITHUB_SHA}
          Git Reference: ${GITHUB_REF_NAME}

          Perl Baseline Version: ${PERL_VERSION}

          Workflow: ${GITHUB_WORKFLOW}
          Runner: ${RUNNER_OS}
          EOF

      - name: Create runtime package
        shell: bash
        run: |
          mkdir runtime-package

          cp build/BUILDINFO.txt runtime-package/
          cp runtime/BASELINE-windows.md runtime-package/

          cd runtime-package

          powershell -Command \
            "Compress-Archive -Path * -DestinationPath ../biodiverse-runtime-dependencies_windows_x64_${VERSION}.zip"

      - name: Generate release metadata
        id: metadata
        shell: bash
        run: |
          FILENAME="biodiverse-runtime-dependencies_windows_x64_${VERSION}.zip"

          SHA=$(sha256sum "$FILENAME" | awk '{print $1}')

          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        if: ${{ inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}.zip

      - name: Upload release artifact
        if: ${{ inputs.build_type == 'release' }}
 
