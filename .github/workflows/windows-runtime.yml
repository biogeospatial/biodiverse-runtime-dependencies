name: Windows Runtime

on:
  push:
    branches:
      - development

  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
    outputs:
      windows_filename:
        value: ${{ jobs.runtime.outputs.windows_filename }}
      windows_sha256:
        value: ${{ jobs.runtime.outputs.windows_sha256 }}

  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: development
        type: choice
        options:
          - development
          - release

permissions:
  contents: write

jobs:
  runtime:
    runs-on: windows-latest

    outputs:
      windows_filename: ${{ steps.metadata.outputs.filename }}
      windows_sha256: ${{ steps.metadata.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v7

      - name: Determine build version
        shell: bash
        run: |
          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install tools
        shell: pwsh
        run: |
          choco install yq -y

      - name: Load runtime configuration
        shell: bash
        run: |
          echo "PERL_VERSION=$(yq -r '.platforms.windows.perl_version' .github/runtime-dependency-config.yml)" >> "$GITHUB_ENV"

      - name: Install Strawberry Perl
        shell: pwsh
        run: |
          choco install strawberryperl -y

      - name: Validate Perl
        shell: pwsh
        run: |
          perl -v

      - name: Generate BUILDINFO.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null

          $perlVersion = perl -e "print $^V"

          @"
          Platform: Windows
          Architecture: x64

          Build Date: $(Get-Date -Format o)
          Git Commit: $env:GITHUB_SHA
          Git Reference: $env:GITHUB_REF_NAME

          Perl Version: $perlVersion

          Workflow: $env:GITHUB_WORKFLOW
          Runner: $env:RUNNER_OS

          Baseline File: BASELINE-windows.md
          "@ | Set-Content build/BUILDINFO.txt

          Get-Content build/BUILDINFO.txt

      - name: Create runtime package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-package

          Copy-Item build/BUILDINFO.txt runtime-package/
          Copy-Item runtime/BASELINE-windows.md runtime-package/

          cd runtime-package

          Compress-Archive -Path * `
            -DestinationPath "../biodiverse-runtime-dependencies_windows_x64_$env:VERSION.zip"

      - name: Generate release metadata
        id: metadata
        shell: pwsh
        run: |
          $filename = "biodiverse-runtime-dependencies_windows_x64_$env:VERSION.zip"

          $hash = Get-FileHash `
            -Path $filename `
            -Algorithm SHA256

          "filename=$filename" >> $env:GITHUB_OUTPUT
          "sha256=$($hash.Hash.ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload release asset
        if: ${{ inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}.zip

      - name: Upload release artifact
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}.zip

      - name: Upload CI artifact
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}.zip
 
