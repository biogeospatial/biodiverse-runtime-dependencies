name: '🔧 Internal: Windows Package Build'

on:
  push:
    branches:
      - development

  workflow_call:
    inputs:
      build_type:
        required: true
        type: string

      reset_cache:
        description: Force runtime cache refresh
        required: false
        default: false
        type: boolean

      verbose_logging:
        description: Enable verbose logging
        required: false
        default: false
        type: boolean

      cache_generation:
        required: true
        type: string

      save_debug_artifacts:
        required: false
        default: false
        type: boolean

    outputs:
      windows_filename:
        value: ${{ jobs.runtime.outputs.windows_filename }}
      windows_sha256:
        value: ${{ jobs.runtime.outputs.windows_sha256 }}

  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: development
        type: choice
        options:
          - development
          - release

      reset_cache:
        description: Force cache refresh
        required: false
        default: false
        type: boolean

      verbose_logging:
        description: Enable verbose logging
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  runtime:
    runs-on: windows-latest

    outputs:
      windows_filename: ${{ steps.metadata.outputs.filename }}
      windows_sha256: ${{ steps.metadata.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: |
          python -m pip install pyyaml

      - name: Generate dependency files
        run: |
          python scripts/generate_dependency_files.py

      - name: Determine build version
        shell: bash
        run: |
          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install tools
        shell: pwsh
        run: |
          choco install yq -y

      - name: Load runtime configuration
        shell: pwsh
        run: |
          $perlVersion = yq -r '.platforms.windows.perl_version' .github/runtime-dependency-config.yml
          $perlPortableUrl = yq -r '.platforms.windows.perl_portable_url' .github/runtime-dependency-config.yml

          "PERL_VERSION=$perlVersion" >> $env:GITHUB_ENV
          "PERL_PORTABLE_URL=$perlPortableUrl" >> $env:GITHUB_ENV

      - name: Configure verbosity
        shell: pwsh
        run: |
          if ("${{ inputs.verbose_logging }}" -eq "true") {
            "VERBOSE_FLAG=-v" >> $env:GITHUB_ENV
          }
          else {
            "VERBOSE_FLAG=" >> $env:GITHUB_ENV
          }

      - name: Cache Strawberry Perl runtime
        id: runtime-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\strawberry-perl
          key: strawberry-perl-${{ runner.os }}-${{ env.PERL_VERSION }}-gen${{ inputs.cache_generation }}-${{ hashFiles('.github/runtime-dependency-config.yml', 'runtime/cpanfile', 'runtime/cpanfile.snapshot') }}

      - name: Install Strawberry Perl
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zipFile = "$env:TEMP\strawberry-perl.zip"

          Invoke-WebRequest `
            -Uri $env:PERL_PORTABLE_URL `
            -OutFile $zipFile

          Expand-Archive `
            -Path $zipFile `
            -DestinationPath "$env:RUNNER_TEMP\strawberry-perl"

          Remove-Item $zipFile

      - name: Configure Perl Runtime
        shell: pwsh
        run: |
          $perlRoot = "$env:RUNNER_TEMP\strawberry-perl"

          $perlExe = Join-Path $perlRoot "perl\bin\perl.exe"

          Write-Host "PERL_ROOT=$perlRoot"
          Write-Host "PERL_EXE=$perlExe"

          if (-not (Test-Path $perlExe)) {
            throw "Unable to locate perl.exe at $perlExe"
          }

          "PERL_ROOT=$perlRoot" >> $env:GITHUB_ENV
          "PERL_EXE=$perlExe" >> $env:GITHUB_ENV

      - name: Validate Perl
        shell: pwsh
        run: |
          Write-Host "Using: $env:PERL_EXE"

          & $env:PERL_EXE -v

      - name: Validate Perl Version
        shell: pwsh
        run: |
          $installedVersion = (& $env:PERL_EXE -e 'print $^V').Trim()

          Write-Host "Installed Perl: $installedVersion"
          Write-Host "Configured Perl: $env:PERL_VERSION"

          if ($installedVersion -ne "v$env:PERL_VERSION") {
            throw "Installed Perl version does not match configured version"
          }

      - name: Install cpanminus
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://cpanmin.us" `
            -OutFile cpanm-installer

          & $env:PERL_EXE cpanm-installer App::cpanminus

          $cpanmPath = Join-Path $env:PERL_ROOT "perl\bin\cpanm.bat"

          if (-not (Test-Path $cpanmPath)) {
              throw "Unable to locate cpanm at $cpanmPath"
          }

          "CPANM=$cpanmPath" >> $env:GITHUB_ENV
          "CPANM_HOME=$HOME\.cpanm" >> $env:GITHUB_ENV

          & $env:PERL_EXE -MApp::cpanminus -e "print qq(cpanminus installed`n)"

          Write-Host "CPANM PATH=$cpanmPath"

          & $cpanmPath --version

      - name: Install Carton
        shell: pwsh
        run: |
          $env:PATH = "$env:PERL_ROOT\perl\site\bin;$env:PERL_ROOT\perl\bin;$env:PERL_ROOT\c\bin;$env:PERL_ROOT\c\x86_64-w64-mingw32\bin;$env:PATH"
          & $env:CPANM Carton

          $cartonPath = Join-Path $env:PERL_ROOT "perl\site\bin\carton.bat"

          if (-not (Test-Path $cartonPath)) {
              throw "Unable to locate Carton at $cartonPath"
          }

          Write-Host "Carton executable: $cartonPath"

          "CARTON=$cartonPath" >> $env:GITHUB_ENV

          & $cartonPath --version

      - name: Validate cpanminus
        shell: pwsh
        run: |
          & $env:PERL_EXE -MApp::cpanminus -e "print qq(cpanminus installed`n)"

          Write-Host "PERL_ROOT=[$env:PERL_ROOT]"
          Write-Host "CPANM=[$env:CPANM]"

          Write-Host "=== perl/bin contents ==="
          Get-ChildItem "$env:PERL_ROOT\perl\bin" |
            Select-Object Name

          if ([string]::IsNullOrWhiteSpace($env:CPANM)) {
            throw "CPANM environment variable is empty"
          }

          if (-not (Test-Path $env:CPANM)) {
            throw "CPANM executable not found at $env:CPANM"
          }

          & $env:CPANM --version

          Write-Host "=== CPANM validation successful ==="

      - name: Install Perl Dependencies
        shell: pwsh
        run: |
          $env:PATH = "$env:PERL_ROOT\perl\site\bin;$env:PERL_ROOT\perl\bin;$env:PERL_ROOT\c\bin;$env:PERL_ROOT\c\x86_64-w64-mingw32\bin;$env:PATH"

          New-Item -ItemType Directory -Force C:\c | Out-Null
          $env:PERL_CPANM_HOME = 'C:\c'

          Write-Host "PERL_CPANM_HOME=$env:PERL_CPANM_HOME"

          & "$env:PERL_ROOT\c\bin\gcc.exe" --version
          & "$env:PERL_ROOT\c\bin\g++.exe" --version

          & $env:PERL_EXE -e "print qq(Using: $^X`n)"

          New-Item -ItemType Directory -Force build | Out-Null

          Push-Location runtime

          $logFile = "..\build\carton-install.log"

          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c `"$env:CARTON install --deployment > $logFile 2>&1`"" `
            -PassThru

          while (-not $process.HasExited) {
              Start-Sleep -Seconds 30

              Write-Host "=== Carton still running ($(Get-Date -Format T)) ==="

              if (Test-Path $logFile) {
                  Get-Content $logFile -Tail 10
              }
          }

          $cartonExitCode = $process.ExitCode


          Write-Host "=== runtime contents ==="
          Get-ChildItem

          if (Test-Path local) {
              Write-Host "=== local structure ==="
              Get-ChildItem local -Recurse |
                Select-Object -First 200 FullName

              Write-Host "=== local size ==="
              $localFiles = Get-ChildItem local -Recurse -File
              Write-Host "Files: $($localFiles.Count)"

              Write-Host "=== Perl modules ==="
              Get-ChildItem local -Recurse -Filter *.pm |
                Select-Object -First 50 FullName

              Write-Host "=== Shared libraries ==="
              Get-ChildItem local -Recurse |
                Where-Object {
                  $_.Name -match '\.(dll|bundle|so)$'
                } |
                Select-Object -First 50 FullName
          }
          else {
              Write-Host "No local directory generated"
          }

          if ($cartonExitCode -ne 0) {
              $latestLog = Get-ChildItem `
                "$env:PERL_ROOT\data\.cpanm\work" `
                -Recurse `
                -Filter build.log `
                -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime |
                  Select-Object -Last 1

              if ($latestLog) {
                  Write-Host "==== Latest build log ===="
                  Write-Host $latestLog.FullName

                  if ("${{ inputs.verbose_logging }}" -eq "true") {
                      Get-Content $latestLog.FullName
                  }
                  else {
                      Write-Host "==== LAST 200 LINES ===="
                      Get-Content $latestLog.FullName -Tail 200
                  }
              }

              New-Item -ItemType Directory -Force ..\build\cpanm-work | Out-Null

              Copy-Item `
                "$env:PERL_ROOT\data\.cpanm\work" `
                ..\build\cpanm-work `
                -Recurse `
                -Force

              Pop-Location
              exit $cartonExitCode
          }

      - name: Validate PDL
        shell: pwsh
        run: |
          $env:PATH = "$env:PERL_ROOT\perl\site\bin;$env:PERL_ROOT\perl\bin;$env:PERL_ROOT\c\bin;$env:PERL_ROOT\c\x86_64-w64-mingw32\bin;$env:PATH"

          Write-Host "=== Carton library structure ==="

          Get-ChildItem `
            runtime\local\lib\perl5 `
            -Recurse `
            -Directory `
            -ErrorAction SilentlyContinue |
              Select-Object -First 100 FullName

          & $env:PERL_EXE -MPDL -e 1
          & $env:PERL_EXE -MPDL -e 'print "$PDL::VERSION`n"'

          Get-ChildItem `
            "$env:PERL_ROOT\perl\vendor\lib\auto\PDL\GSL\CDF" `
            -ErrorAction SilentlyContinue

          Get-ChildItem `
            "$env:PERL_ROOT" `
            -Recurse `
            -Filter "*gsl*.dll" `
            -ErrorAction SilentlyContinue |
              Select-Object FullName

          & $env:PERL_EXE -MPDL::GSL::CDF -e 1
          & $env:PERL_EXE -MPDL::GSL::CDF -e 'print "$PDL::GSL::CDF::VERSION`n"'

      - name: Generate BUILDINFO.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null

          $env:PATH = "$env:PERL_ROOT\perl\site\bin;$env:PERL_ROOT\perl\bin;$env:PERL_ROOT\c\bin;$env:PERL_ROOT\c\x86_64-w64-mingw32\bin;$env:PATH"

          $perlVersion = (
            & $env:PERL_EXE -e 'print $^V'
          ).Trim()

          $cpanmVersion = (
            & $env:PERL_EXE -MApp::cpanminus -e 'print "$App::cpanminus::VERSION"'
          ).Trim()

          $pdlVersion = (
            & $env:PERL_EXE -MPDL -e 'print $PDL::VERSION'
          ).Trim()

          $cartonVersion = (& $env:CARTON --version).Trim()

          if (Test-Path runtime/cpanfile.snapshot) {
            $snapshotSha = (
              Get-FileHash `
                -Path runtime/cpanfile.snapshot `
                -Algorithm SHA256
            ).Hash.ToLower()
          }
          else {
            $snapshotSha = "Not Present"
          }

          @(
            "Platform: Windows"
            "Architecture: x64"
            ""
            "Build Date: $(Get-Date -Format o)"
            "Git Commit: $env:GITHUB_SHA"
            "Git Reference: $env:GITHUB_REF_NAME"
            ""
            "Perl Version: $perlVersion"
            "cpanm Version: $cpanmVersion"
            "Carton Version: $cartonVersion"
            ""
            "Dependency Installation Method: Carton"
            "Dependency Installation Mode: Deployment"
            "Dependency Definition File: runtime/cpanfile"
            "Dependency Snapshot File: runtime/cpanfile.snapshot"
            "Snapshot SHA256: $snapshotSha"
            ""
            "PDL Version: $pdlVersion"
            ""
            "Workflow: $env:GITHUB_WORKFLOW"
            "Runner: $env:RUNNER_OS"
            ""
            "Baseline File: BASELINE-windows.md"
          ) | Set-Content build/BUILDINFO.txt

          Get-Content build/BUILDINFO.txt

      - name: Upload dependency diagnostics
        if: ${{ always() && (failure() || inputs.save_debug_artifacts) }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-diagnostics-windows
          path: |
            build/carton-install.log
            build/cpanm-work
            runtime/cpanfile
            runtime/cpanfile.snapshot

      - name: Create runtime package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-package | Out-Null

          Copy-Item build/BUILDINFO.txt runtime-package/
          Copy-Item runtime/BASELINE-windows.md runtime-package/
          Copy-Item runtime/cpanfile runtime-package/
          Copy-Item runtime/cpanfile.snapshot runtime-package/

          Copy-Item `
            -Path runtime/local `
            -Destination runtime-package/local `
            -Recurse

          Copy-Item `
            -Path $env:PERL_ROOT `
            -Destination runtime-package/perl `
            -Recurse

          Set-Location runtime-package

          Compress-Archive `
            -Path * `
            -DestinationPath "../biodiverse-runtime-dependencies_windows_x64_$env:VERSION.zip"

      - name: Generate release metadata
        id: metadata
        shell: pwsh
        run: |
          $filename = "biodiverse-runtime-dependencies_windows_x64_$env:VERSION.zip"

          $hash = Get-FileHash `
            -Path $filename `
            -Algorithm SHA256

          "filename=$filename" >> $env:GITHUB_OUTPUT
          "sha256=$($hash.Hash.ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload release asset
        if: ${{ inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}.zip

      - name: Upload release artifact
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}.zip

      - name: Upload CI artifact
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_windows_x64_${{ env.VERSION }}.zip
