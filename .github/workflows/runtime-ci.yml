name: "📦 Build: Runtime Packages"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

      reset_cache:
        description: Force cache refresh
        required: false
        default: false
        type: boolean

      verbose_logging:
        description: Enable verbose logging
        required: false
        default: false
        type: boolean

  pull_request:

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' ||
            inputs.platform == 'all' ||
            inputs.platform == 'windows' }}
    uses: ./.github/workflows/windows-runtime.yml
    with:
      build_type: development
      reset_cache: ${{ inputs.reset_cache }}
      verbose_logging: ${{ inputs.verbose_logging }}

  macos:
    if: ${{ github.event_name != 'workflow_dispatch' ||
            inputs.platform == 'all' ||
            inputs.platform == 'macos' }}
    uses: ./.github/workflows/macos-runtime.yml
    with:
      build_type: development
      reset_cache: ${{ inputs.reset_cache }}
      verbose_logging: ${{ inputs.verbose_logging }}

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' ||
            inputs.platform == 'all' ||
            inputs.platform == 'linux' }}
    uses: ./.github/workflows/linux-runtime.yml
    with:
      build_type: development
      reset_cache: ${{ inputs.reset_cache }}
      verbose_logging: ${{ inputs.verbose_logging }}
