name: macOS Runtime

on:
  push:
    branches:
      - development

  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
    outputs:
      macos_filename:
        value: ${{ jobs.runtime.outputs.macos_filename }}
      macos_sha256:
        value: ${{ jobs.runtime.outputs.macos_sha256 }}

  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: development
        type: choice
        options:
          - development
          - release

permissions:
  contents: write

jobs:
  runtime:
    runs-on: macos-latest

    outputs:
      macos_filename: ${{ steps.metadata.outputs.filename }}
      macos_sha256: ${{ steps.metadata.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          brew bundle --file runtime/Brewfile

      - name: Determine build version
        shell: bash
        run: |
          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Load runtime configuration
        shell: bash
        run: |
          echo "PERL_VERSION=$(yq -r '.platforms.macos.perl_version' .github/runtime-dependency-config.yml)" >> "$GITHUB_ENV"

      - name: Cache perlbrew
        uses: actions/cache@v6
        with:
          path: ~/perl5/perlbrew
          key: perlbrew-${{ env.PERL_VERSION }}-${{ runner.os }}

      - name: Install perlbrew
        shell: bash
        run: |
          curl -L https://install.perlbrew.pl | bash

      - name: Build Perl
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc

          if ! perlbrew list | grep -q "perl-${PERL_VERSION}"; then
            perlbrew install --notest perl-${PERL_VERSION}
          fi

          perlbrew use perl-${PERL_VERSION}
          perl -v

      - name: Verify Perl Installation
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          perl -e 'print "$^V\n"'

      - name: Generate BUILDINFO.txt
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          mkdir -p build

          cat > build/BUILDINFO.txt <<EOF
          Platform: macOS
          Architecture: $(uname -m)

          Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Git Commit: ${GITHUB_SHA}
          Git Reference: ${GITHUB_REF_NAME}

          Perl Version: $(perl -e 'print $^V')

          Workflow: ${GITHUB_WORKFLOW}
          Runner: ${RUNNER_OS}

          Baseline File: BASELINE-macos.md
          EOF

      - name: Create runtime package
        shell: bash
        run: |
          PACKAGE_DIR="${RUNNER_TEMP}/runtime-package"

          mkdir -p "${PACKAGE_DIR}"

          cp build/BUILDINFO.txt "${PACKAGE_DIR}/"
          cp runtime/BASELINE-macos.md "${PACKAGE_DIR}/"
          cp runtime/cpanfile "${PACKAGE_DIR}/"

          mkdir -p "${PACKAGE_DIR}/perl"

          cp -a ~/perl5/perlbrew/perls/perl-${PERL_VERSION} \
            "${PACKAGE_DIR}/perl/"

          cd "${PACKAGE_DIR}"

          zip -r \
            "${GITHUB_WORKSPACE}/biodiverse-runtime-dependencies_macos_arm64_${VERSION}.zip" \
            .

      - name: Inspect package output
        shell: bash
        run: |
          ls -lah "${GITHUB_WORKSPACE}"

      - name: Generate release metadata
        id: metadata
        shell: bash
        run: |
          FILENAME="biodiverse-runtime-dependencies_macos_arm64_${VERSION}.zip"

          SHA=$(shasum -a 256 "${GITHUB_WORKSPACE}/${FILENAME}" | awk '{print $1}')

          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        if: ${{ inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}.zip

      - name: Upload release artifact
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}.zip

      - name: Upload CI artifact
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}.zip
