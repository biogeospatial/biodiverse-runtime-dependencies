name: '🔧 Internal: macOS Package Build'

on:
  push:
    branches:
      - development

  workflow_call:
    inputs:
      build_type:
        required: true
        type: string

      reset_cache:
        required: false
        default: false
        type: boolean

      verbose_logging:
        required: false
        default: false
        type: boolean

      cache_generation:
        required: true
        type: string

      save_debug_artifacts:
        required: false
        default: false
        type: boolean

      runner_image:
        required: true
        type: string

    outputs:
      macos_filename:
        value: ${{ jobs.runtime.outputs.macos_filename }}
      macos_sha256:
        value: ${{ jobs.runtime.outputs.macos_sha256 }}

  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: development
        type: choice
        options:
          - development
          - release

      reset_cache:
        description: Force cache refresh
        required: false
        default: false
        type: boolean

      verbose_logging:
        description: Enable verbose logging
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ${{ inputs.runner_image }}

    outputs:
      macos_filename: ${{ steps.metadata.outputs.filename }}
      macos_sha256: ${{ steps.metadata.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: |
          python -m pip install pyyaml

      - name: Generate dependency files
        run: |
          python scripts/generate_dependency_files.py

      - name: Install tools
        run: |
          brew bundle --file runtime/Brewfile

      - name: Determine build version
        shell: bash
        run: |
          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Load runtime configuration
        shell: bash
        run: |
          echo "PERL_VERSION=$(yq -r '.platforms.macos.perl_version' .github/runtime-dependency-config.yml)" >> "$GITHUB_ENV"
          echo "OPENSSL_FORMULA=$(yq -r '.platforms.macos.openssl_formula' .github/runtime-dependency-config.yml)" >> "$GITHUB_ENV"

      - name: Cache perlbrew
        uses: actions/cache@v6
        with:
          path: ~/perl5/perlbrew
          key: perlbrew-${{ runner.os }}-${{ env.PERL_VERSION }}-gen${{ inputs.cache_generation }}-${{ hashFiles('.github/runtime-dependency-config.yml', 'runtime/cpanfile.snapshot') }}

      - name: Configure verbosity
        shell: bash
        run: |
          if [ "${{ inputs.verbose_logging }}" = "true" ]; then
            echo "VERBOSE_FLAG=-v" >> "$GITHUB_ENV"
          else
            echo "VERBOSE_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Setup Perl Environment
        shell: bash
        run: |
          chmod +x scripts/setup-perl-environment.sh
          scripts/setup-perl-environment.sh

      - name: Validate cpanminus
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          "$CPANM" --version

          echo "CPANM=$CPANM"
          find "$HOME" -type d -name ".cpanm" 2>/dev/null

          echo "CPANM_HOME=$CPANM_HOME"

          if [ -d "$CPANM_HOME" ]; then
              echo "Directory exists"

              find "$CPANM_HOME" | head -100 || true

              du -sh "$CPANM_HOME"
          else
              echo "Directory missing"
          fi

      - name: Install Net::SSLeay
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          echo "Using OpenSSL from: $(brew --prefix ${OPENSSL_FORMULA})"
          OPENSSL_PREFIX="$(brew --prefix ${OPENSSL_FORMULA})" \
            "$CPANM" $VERBOSE_FLAG Net::SSLeay

          perl -MNet::SSLeay -e 'print $Net::SSLeay::VERSION,"\n"'

      - name: Install Perl Dependencies
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          mkdir -p build

          cd runtime

          OPENSSL_PREFIX="$(brew --prefix ${OPENSSL_FORMULA})" \
            carton install --deployment 2>&1 | tee ../build/carton-install.log
          CARTON_EXIT_CODE=${PIPESTATUS[0]}

          echo "=== runtime contents ==="
          ls -lah

          if [ -d local ]; then
            echo "=== local structure ==="
            find local -maxdepth 4 | sort | head -200 || true

            echo "=== local size ==="
            du -sh local

            echo "=== Perl modules ==="
            find local -name '*.pm' | head -50 || true

            echo "=== Shared libraries ==="
            find local \( -name '*.so' -o -name '*.bundle' -o -name '*.dll' \) | head -50 || true
          else
            echo "No local directory generated"
          fi

          if [ $CARTON_EXIT_CODE -ne 0 ]; then
            find "$HOME/.cpanm/work" -name build.log -exec sh -c '
              echo "==== $1 ===="
              cat "$1"
            ' _ {} \;

            exit $CARTON_EXIT_CODE
          fi

          if [ $? -ne 0 ]; then
            find "$HOME/.cpanm/work" -name build.log -exec sh -c '
              echo "==== $1 ===="
              cat "$1"
            ' _ {} \;
            exit 1
          fi

      - name: Validate PDL
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          export PERL5LIB="${GITHUB_WORKSPACE}/runtime/local/lib/perl5:${GITHUB_WORKSPACE}/runtime/local/lib/perl5/x86_64-linux"

          perl -MPDL -e 1

          perl -MPDL -e 'print "$PDL::VERSION\n"'

          perl -MPDL::GSL::CDF -e 1

          perl -MPDL::GSL::CDF -e 'print "$PDL::GSL::CDF::VERSION\n"'

      - name: Generate BUILDINFO.txt
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          export PERL5LIB="${GITHUB_WORKSPACE}/runtime/local/lib/perl5:${GITHUB_WORKSPACE}/runtime/local/lib/perl5/x86_64-linux"

          CPANM_VERSION=$(perl -MApp::cpanminus -e 'print $App::cpanminus::VERSION')
          PDL_VERSION=$(perl -MPDL -e 'print $PDL::VERSION')

          CARTON_VERSION=$(carton --version)

          if [ -f runtime/cpanfile.snapshot ]; then
            SNAPSHOT_SHA=$(shasum -a 256 runtime/cpanfile.snapshot | awk '{print $1}')
          else
            SNAPSHOT_SHA="Not Present"
          fi

          mkdir -p build

          cat > build/BUILDINFO.txt <<EOF
          Platform: macOS
          Architecture: $(uname -m)

          Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Git Commit: ${GITHUB_SHA}
          Git Reference: ${GITHUB_REF_NAME}

          Perl Version: $(perl -e 'print $^V')
          cpanm Version: ${CPANM_VERSION}
          Carton Version: ${CARTON_VERSION}

          Dependency Installation Method: Carton
          Dependency Installation Mode: Deployment
          Dependency Definition File: runtime/cpanfile
          Dependency Snapshot File: runtime/cpanfile.snapshot
          Snapshot SHA256: ${SNAPSHOT_SHA}

          PDL Version: ${PDL_VERSION}

          Workflow: ${GITHUB_WORKFLOW}
          Runner: ${RUNNER_OS}

          Baseline File: GENERATED-BASELINE-macos.md
          EOF

          cat build/BUILDINFO.txt

      - name: Upload dependency diagnostics
        if: ${{ always() && (failure() || inputs.save_debug_artifacts) }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-diagnostics-macos
          path: |
            build/carton-install.log
            runtime/cpanfile
            runtime/cpanfile.snapshot
            /Users/runner/.cpanm/build.log
            /Users/runner/.cpanm/work/**/build.log

      - name: Create runtime package
        shell: bash
        run: |
          PACKAGE_DIR="${RUNNER_TEMP}/runtime-package"

          mkdir -p "${PACKAGE_DIR}"

          cp build/BUILDINFO.txt "${PACKAGE_DIR}/"
          cp runtime/GENERATED-BASELINE-macos.md "${PACKAGE_DIR}/"
          cp runtime/cpanfile "${PACKAGE_DIR}/"
          cp runtime/cpanfile.snapshot "${PACKAGE_DIR}/"

          cp -a runtime/local "${PACKAGE_DIR}/"

          mkdir -p "${PACKAGE_DIR}/perl"

          cp -a ~/perl5/perlbrew/perls/perl-${PERL_VERSION} \
            "${PACKAGE_DIR}/perl/"

          cd "${PACKAGE_DIR}"

          zip -r \
            "${GITHUB_WORKSPACE}/biodiverse-runtime-dependencies_macos_arm64_${VERSION}.zip" \
            .

      - name: Inspect package output
        shell: bash
        run: |
          ls -lah "${GITHUB_WORKSPACE}"

      - name: Generate release metadata
        id: metadata
        shell: bash
        run: |
          FILENAME="biodiverse-runtime-dependencies_macos_arm64_${VERSION}.zip"

          SHA=$(shasum -a 256 "${GITHUB_WORKSPACE}/${FILENAME}" | awk '{print $1}')

          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        if: ${{ inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}.zip

      - name: Upload release artifact
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}.zip

      - name: Upload CI artifact
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_macos_arm64_${{ env.VERSION }}.zip
