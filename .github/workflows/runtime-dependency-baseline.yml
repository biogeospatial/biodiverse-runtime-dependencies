name: "🔧 Internal: Runtime Dependency Baseline"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: |
          python -m pip install pyyaml

      - name: Generate dependency files
        run: |
          python scripts/generate_dependency_files.py

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Load runtime configuration
        run: |
          echo "PERL_VERSION=$(yq -r '.platforms.linux.perl_version' .github/runtime-dependency-config.yml)" >> "$GITHUB_ENV"

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            patch \
            perl \
            zlib1g-dev \
            libgsl-dev

      - name: Setup Perl Environment
        run: |
          chmod +x scripts/setup-perl-environment.sh
          scripts/setup-perl-environment.sh

      - name: Verify Tooling
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          perl -v

          "$CPANM" --version

          carton --version

      - name: Generate Runtime Dependency Baseline
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          cd runtime

          carton install

      - name: Check for baseline changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- runtime/cpanfile.snapshot; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show baseline status
        run: |
          git status

      - name: Commit updated baseline
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add runtime/cpanfile.snapshot

          git commit -m "update dependency baseline"

      - name: Show recent commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git log -1 --stat
