name: '🔧 Internal: Linux Package Build'

on:
  push:
    branches:
      - development

  workflow_call:
    inputs:
      build_type:
        required: true
        type: string

      reset_cache:
        description: Force cache refresh
        required: false
        default: false
        type: boolean

      verbose_logging:
        description: Enable verbose logging
        required: false
        default: false
        type: boolean

      cache_generation:
        required: true
        type: string

      save_debug_artifacts:
        required: false
        default: false
        type: boolean

    outputs:
      linux_filename:
        value: ${{ jobs.runtime.outputs.linux_filename }}
      linux_sha256:
        value: ${{ jobs.runtime.outputs.linux_sha256 }}

  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: development
        type: choice
        options:
          - development
          - release

      reset_cache:
        description: Force runtime cache refresh
        required: false
        default: false
        type: boolean

      verbose_logging:
        description: Enable verbose logging
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest

    outputs:
      linux_filename: ${{ steps.metadata.outputs.filename }}
      linux_sha256: ${{ steps.metadata.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yq zip

      - name: Determine build version
        shell: bash
        run: |
          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Load runtime configuration
        shell: bash
        run: |
          echo "PERL_VERSION=$(yq -r '.platforms.linux.perl_version' .github/runtime-dependency-config.yml)" >> "$GITHUB_ENV"

      - name: Configure verbosity
        shell: bash
        run: |
          if [ "${{ inputs.verbose_logging }}" = "true" ]; then
            echo "VERBOSE_FLAG=-v" >> "$GITHUB_ENV"
          else
            echo "VERBOSE_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Install Perl build dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            patch \
            perl \
            zlib1g-dev \
            libgsl-dev

      - name: Cache perlbrew
        uses: actions/cache@v6
        with:
          path: ~/perl5/perlbrew
          key: perlbrew-${{ runner.os }}-${{ env.PERL_VERSION }}-gen${{ inputs.cache_generation }}-${{ hashFiles('.github/runtime-dependency-config.yml', 'runtime/cpanfile') }}

      - name: Install perlbrew
        shell: bash
        run: |
          curl -L https://install.perlbrew.pl | bash

      - name: Build Perl
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc

          if ! perlbrew list | grep -q "perl-${PERL_VERSION}"; then
            perlbrew install --notest perl-${PERL_VERSION}
          fi

          perlbrew use perl-${PERL_VERSION}

          perl -v

      - name: Install cpanminus
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          curl -L https://cpanmin.us | perl - App::cpanminus

          CPANM=$(command -v cpanm)

          echo "CPANM=$CPANM" >> "$GITHUB_ENV"

          CPANM_HOME="$HOME/.cpanm"
          echo "CPANM_HOME=$CPANM_HOME" >> "$GITHUB_ENV"

          "$CPANM" --version

      - name: Validate cpanminus
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          "$CPANM" --version

          echo "CPANM=$CPANM"

          find "$HOME" -type d -name ".cpanm" 2>/dev/null

          echo "CPANM_HOME=$CPANM_HOME"

          if [ -d "$CPANM_HOME" ]; then
              echo "Directory exists"

              find "$CPANM_HOME" | head -100

              du -sh "$CPANM_HOME"
          else
              echo "Directory missing"
          fi

      - name: Install Perl Dependencies
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          cd runtime

          "$CPANM" $VERBOSE_FLAG --installdeps .

          cd runtime

          cpanm $VERBOSE_FLAG --installdeps .

          if [ $? -ne 0 ]; then
            find "$HOME/.cpanm/work" -name build.log -exec sh -c '
              echo "==== $1 ===="
              cat "$1"
            ' _ {} \;
            exit 1
          fi

      - name: Validate PDL
        shell: bash
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}

          perl -MPDL -e 1

          perl -MPDL -e 'print "$PDL::VERSION\n"'

          perl -MPDL::GSL::CDF -e 1

          perl -MPDL::GSL::CDF -e 'print "$PDL::GSL::CDF::VERSION\n"'

      - name: Generate BUILDINFO.txt
        shell: bash
        run: |
          mkdir -p build

          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use perl-${PERL_VERSION}
          CPANM_VERSION=$(perl -MApp::cpanminus -e 'print $App::cpanminus::VERSION')
          PDL_VERSION=$(perl -MPDL -e 'print $PDL::VERSION')

          cat > build/BUILDINFO.txt <<EOF
          Platform: Linux
          Architecture: $(uname -m)

          Build Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Git Commit: ${GITHUB_SHA}
          Git Reference: ${GITHUB_REF_NAME}

          Perl Version: $(perl -e 'print $^V')
          cpanm Version: ${CPANM_VERSION}
          Dependency Definition File: cpanfile

          PDL Version: ${PDL_VERSION}

          Workflow: ${GITHUB_WORKFLOW}
          Runner: ${RUNNER_OS}

          Baseline File: BASELINE-linux.md
          EOF

          cat build/BUILDINFO.txt

      - name: Upload cpanm diagnostics
        if: ${{ always() && (failure() || inputs.save_debug_artifacts) }}
        uses: actions/upload-artifact@v7
        with:
          name: cpanm-diagnostics-linux
          path: |
            /home/runner/.cpanm/build.log
            /home/runner.cpanm/work/**/build.log

      - name: Create runtime package
        shell: bash
        run: |
          PACKAGE_DIR="${RUNNER_TEMP}/runtime-package"

          mkdir -p "${PACKAGE_DIR}"

          cp build/BUILDINFO.txt "${PACKAGE_DIR}/"
          cp runtime/BASELINE-linux.md "${PACKAGE_DIR}/"
          cp runtime/cpanfile "${PACKAGE_DIR}/"

          mkdir -p "${PACKAGE_DIR}/perl"

          cp -a ~/perl5/perlbrew/perls/perl-${PERL_VERSION} \
            "${PACKAGE_DIR}/perl/"

          cd "${PACKAGE_DIR}"

          zip -r \
            "${GITHUB_WORKSPACE}/biodiverse-runtime-dependencies_linux_x64_${VERSION}.zip" \
            .

      - name: Inspect package output
        shell: bash
        run: |
          ls -lah "${GITHUB_WORKSPACE}"

      - name: Generate release metadata
        id: metadata
        shell: bash
        run: |
          FILENAME="biodiverse-runtime-dependencies_linux_x64_${VERSION}.zip"

          SHA=$(sha256sum "${GITHUB_WORKSPACE}/${FILENAME}" | awk '{print $1}')

          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        if: ${{ inputs.build_type == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            biodiverse-runtime-dependencies_linux_x64_${{ env.VERSION }}.zip

      - name: Upload release artifact
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_linux_x64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_linux_x64_${{ env.VERSION }}.zip

      - name: Upload CI artifact
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: biodiverse-runtime-dependencies_linux_x64_${{ env.VERSION }}
          path: biodiverse-runtime-dependencies_linux_x64_${{ env.VERSION }}.zip
